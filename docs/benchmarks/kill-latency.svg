<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" width="760" height="304" role="img" aria-labelledby="t d"><title id="t">Session kill latency</title><desc id="d">Bar chart of kill latency for tymux and tmux</desc>
<style>
  .bg{fill:#ffffff} .fg{fill:#1f2328} .mut{fill:#59636e} .grid{stroke:#d1d9e0;stroke-width:1}
