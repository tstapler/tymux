name: CI

# Every third-party action below is pinned to an exact commit SHA, not a
# floating major-version tag (@v1 etc.) — a tag can be silently retargeted
# after the fact (e.g. the 2025 tj-actions/changed-files incident), and
# several of these jobs carry write-scoped tokens. Each pin's trailing
# comment names the tagged release it was resolved from, for humans
# updating it later; re-resolve and re-audit rather than trusting the new
# tag's diff alone.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      # macos-13 (Intel) deliberately excluded: GitHub-hosted macos-13
      # runners queued indefinitely (50+ min, never started) when tried on
      # this repo — a real capacity/deprecation issue, not flakiness.
      # macos-latest (Apple Silicon) is the only macOS leg for now; see
      # plan.md Unresolved Question #2 for the related ARM64 runner note.
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-26 -- rust-toolchain.toml's channel="stable" still controls the actual Rust version installed
        with:
          components: clippy, rustfmt
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.os == 'ubuntu-latest'
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}
      - if: matrix.os == 'ubuntu-latest'
        run: buf lint proto
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace

  musl-build:
    # Both musl targets the release workflow ships (Epic 8 Story 8.1) are
    # validated on every PR, not just at release time — aarch64 needs a
    # cross linker the x86_64 leg doesn't (see the per-target step below).
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-26 -- rust-toolchain.toml's channel="stable" still controls the actual Rust version installed
        with:
          targets: ${{ matrix.target }}
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      # Build-only: the musl targets have no bundled test runner on
      # ubuntu-latest without extra setup, so this verifies compilation
      # (and thus portable-pty's musl linking) continuously, on every PR.
      - run: cargo build --workspace --target ${{ matrix.target }}

  macos-cross-build:
    # x86_64-apple-darwin is the one release target with no PR coverage:
    # aarch64-apple-darwin is implicitly exercised by the native build in
    # the `test` job's macos-latest leg, but the x86_64 cross-target only
    # ever got built at tag-release time. Same gap class musl-build already
    # closed for the musl targets — catch a broken cross-link before a
    # release, not during one.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-26 -- rust-toolchain.toml's channel="stable" still controls the actual Rust version installed
        with:
          targets: x86_64-apple-darwin
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-cross-build
      - run: cargo build --workspace --target x86_64-apple-darwin

  ts-client:
    # Story 7.1 Task 4 (buf generate drift check) + Story 7.2 Task 3 /
    # Story 7.3 Task 7 (standing cross-language RPC proof on every PR —
    # plan.md §5 Risk Control pre-mortem.md Failure #5: a proof that isn't
    # re-run on every PR is the same class of gap as a test that doesn't run).
    runs-on: ubuntu-latest
    # A healthy run finishes in well under 2 minutes; bound it so a rare,
    # non-reproducing test-process hang (observed once: tsx --test stopped
    # producing output mid-suite) fails fast instead of idling toward
    # GitHub's 360-minute default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-26 -- rust-toolchain.toml's channel="stable" still controls the actual Rust version installed
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ts-client
      - run: cargo build --bin tymuxd
      - working-directory: clients/ts
        run: npm install
      - name: buf generate drift check
        working-directory: proto
        run: |
          buf generate --template buf.gen.ts.yaml
          git diff --exit-code -- ../clients/ts/gen
      - working-directory: clients/ts
        run: npm run build
      - working-directory: clients/ts
        run: npm test
        env:
          TYMUXD_BIN: ${{ github.workspace }}/target/debug/tymuxd

  go-client:
    # Phase 5 spec-compliance sweep, Gap 1: clients/go (Epic 1.6) had no CI
    # coverage at all — the exact class of gap that already bit the TS
    # client once during Epic 1.6 (a proto change without a regenerated
    # client, caught only by hand). Mirrors ts-client's buf generate drift
    # check and its live-daemon integration test (Story 7.2 AC1 pattern),
    # so this job fails if the generated Go client can't actually talk to a
    # real tymuxd, not just if it fails to compile.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-26 -- rust-toolchain.toml's channel="stable" still controls the actual Rust version installed
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: clients/go/go.mod
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: go-client
      - run: cargo build --bin tymuxd
      - name: install protoc-gen-go / protoc-gen-connect-go
        # Pinned to the exact versions already required by clients/go/go.mod
        # (google.golang.org/protobuf, connectrpc.com/connect) rather than
        # @latest, so a compromised release of either tool can't be pulled
        # into a job that carries an ambient GITHUB_TOKEN.
        run: |
          GOBIN=${{ github.workspace }}/clients/go/bin go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          GOBIN=${{ github.workspace }}/clients/go/bin go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0
      - name: buf generate drift check
        working-directory: proto
        run: |
          buf generate --template buf.gen.go.yaml
          git diff --exit-code -- ../clients/go/gen
      - name: go build / go vet / go test
        working-directory: clients/go
        run: |
          go build ./...
          go vet ./...
          go test ./...
        env:
          TYMUXD_BIN: ${{ github.workspace }}/target/debug/tymuxd

  tag-version-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-26 -- rust-toolchain.toml's channel="stable" still controls the actual Rust version installed
      - name: Verify tag matches workspace version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          WORKSPACE_VERSION="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          if [ "$TAG_VERSION" != "$WORKSPACE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match workspace version $WORKSPACE_VERSION"
            exit 1
          fi
