name: Release

# Every third-party action below is pinned to an exact commit SHA, not a
# floating major-version tag (@v1 etc.) — a tag can be silently retargeted
# after the fact (e.g. the 2025 tj-actions/changed-files incident), and
# both jobs here carry contents: write. Each pin's trailing comment names
# the tagged release it was resolved from, for humans updating it later;
# re-resolve and re-audit rather than trusting the new tag's diff alone.

on:
  push:
    tags: ["v*"]
  # auto-release.yml starts this against the tag it just pushed (a tag pushed
  # with GITHUB_TOKEN doesn't trigger the push event above). Run it with
  # --ref <tag>: create-release and the stamp step both read the tag from the ref.
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # git-cliff reads the commits between this tag and the previous one
      - uses: tstapler/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # fork of taiki-e/create-gh-release-action, upstream v1.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@db5fb34fa772531a3ece57ca434f579eb334e0fb # v2.75.30
        with:
          tool: git-cliff
      - name: Write release notes from Conventional Commits
        continue-on-error: true # cosmetic: never block the asset upload over release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git cliff --latest --strip header --output "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            echo "::notice::no releasable commits for $GITHUB_REF_NAME; leaving the default notes"
          fi

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # Both Darwin legs run on macos-latest (Apple Silicon): macOS's
          # native toolchain (Xcode/clang) can cross-link x86_64-apple-darwin
          # from an arm64 host. macos-13 (Intel) is deliberately not used
          # here — GitHub-hosted macos-13 runners queued 50+ min with zero
          # progress when tried on this repo in Epic 1's CI (see ci.yml).
          # codesign: "-" is ad-hoc signing (no certificate, no secret to
          # manage) — satisfies Apple Silicon's hard requirement that a
          # binary be signed to execute at all. It does NOT satisfy
          # Gatekeeper for a downloaded/quarantined file; that needs a
          # paid Apple Developer ID certificate + notarization, which
          # nobody has provisioned for this repo yet.
          - target: x86_64-apple-darwin
            os: macos-latest
            codesign: "-"
          - target: aarch64-apple-darwin
            os: macos-latest
            codesign: "-"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-26 -- rust-toolchain.toml's channel="stable" still controls the actual Rust version installed
        with:
          targets: ${{ matrix.target }}
      # main's Cargo.toml version is not bumped per release (auto-release.yml
      # only pushes a tag), so make the shipped binaries report the tag's version.
      - name: Stamp workspace version from tag
        shell: bash
        run: |
          export V="${GITHUB_REF_NAME#v}"
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{V}"/m' Cargo.toml
          [ "$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')" = "$V" ]
      - uses: tstapler/gha-actions/setup-protoc@9730d74171a0480cc091db7c34f6e18ccbdf273d # gha-actions main, includes setup-buf/setup-protoc (#1)
      # aarch64-unknown-linux-musl needs a cross linker the ubuntu-latest
      # runner doesn't ship by default (unlike x86_64-unknown-linux-musl,
      # which only needs musl-tools) — this action wires up the right
      # cross toolchain for both musl targets uniformly.
      - if: contains(matrix.target, 'musl')
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}
      - uses: tstapler/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # fork of taiki-e/upload-rust-binary-action, upstream v1.30.2
        with:
          # tymux-cli is the package name; its actual [[bin]] target is
          # named tymux (crates/tymux-cli/Cargo.toml).
          bin: tymuxd,tymux
          # The default archive name ($bin-$target) only works for a
          # single binary — tymuxd and tymux ship together in one archive
          # per target, so this must be named explicitly.
          archive: tymux-$target
          target: ${{ matrix.target }}
          codesign: ${{ matrix.codesign }}
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # Publishes the formula to tstapler/homebrew-tap as the "tstapler-homebrew-tap-writer" GitHub App
  # via the shared publish-homebrew-formula action (short-lived token, push-race retry). Needs, on
  # this repo:
  #   variable HOMEBREW_TAP_APP_CLIENT_ID    the app's Client ID (not secret)
  #   secret   HOMEBREW_TAP_APP_PRIVATE_KEY  a private key generated for the app
  # (set both with `set-homebrew-tap-app-credentials`). Without them the job skips with a notice,
  # so a release never fails over the tap.
  update-homebrew:
    needs: upload-assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_CLIENT_ID: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
    steps:
      - name: Check for the tap app credentials
        id: gate
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::HOMEBREW_TAP_APP_CLIENT_ID / HOMEBREW_TAP_APP_PRIVATE_KEY are not set; skipping the Homebrew tap update"; fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: steps.gate.outputs.enabled == 'true'
        id: render
        name: Render the formula from the published archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir "$RUNNER_TEMP/assets"
          gh release download "$GITHUB_REF_NAME" --pattern 'tymux-*.tar.gz' --dir "$RUNNER_TEMP/assets"
          scripts/render-homebrew-formula.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/assets" > "$RUNNER_TEMP/tymux.rb"
          cat "$RUNNER_TEMP/tymux.rb"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.enabled == 'true'
        uses: tstapler/gha-actions/publish-homebrew-formula@dcc4013f1e0c983a6926d22b1cb9acf3aba9a489 # gha-actions main, includes publish-homebrew-formula (#2)
        with:
          client-id: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          files: ${{ runner.temp }}/tymux.rb:Formula/tymux.rb
          commit-message: tymux ${{ steps.render.outputs.version }}
