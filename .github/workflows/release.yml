name: Release

on:
  push:
    tags: ["v*"]

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # Both Darwin legs run on macos-latest (Apple Silicon): macOS's
          # native toolchain (Xcode/clang) can cross-link x86_64-apple-darwin
          # from an arm64 host. macos-13 (Intel) is deliberately not used
          # here — GitHub-hosted macos-13 runners queued 50+ min with zero
          # progress when tried on this repo in Epic 1's CI (see ci.yml).
          # codesign: "-" is ad-hoc signing (no certificate, no secret to
          # manage) — satisfies Apple Silicon's hard requirement that a
          # binary be signed to execute at all. It does NOT satisfy
          # Gatekeeper for a downloaded/quarantined file; that needs a
          # paid Apple Developer ID certificate + notarization, which
          # nobody has provisioned for this repo yet.
          - target: x86_64-apple-darwin
            os: macos-latest
            codesign: "-"
          - target: aarch64-apple-darwin
            os: macos-latest
            codesign: "-"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # aarch64-unknown-linux-musl needs a cross linker the ubuntu-latest
      # runner doesn't ship by default (unlike x86_64-unknown-linux-musl,
      # which only needs musl-tools) — this action wires up the right
      # cross toolchain for both musl targets uniformly.
      - if: contains(matrix.target, 'musl')
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          # tymux-cli is the package name; its actual [[bin]] target is
          # named tymux (crates/tymux-cli/Cargo.toml).
          bin: tymuxd,tymux
          # The default archive name ($bin-$target) only works for a
          # single binary — tymuxd and tymux ship together in one archive
          # per target, so this must be named explicitly.
          archive: tymux-$target
          target: ${{ matrix.target }}
          codesign: ${{ matrix.codesign }}
          token: ${{ secrets.GITHUB_TOKEN }}
