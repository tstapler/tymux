name: Release

# Every third-party action below is pinned to an exact commit SHA, not a
# floating major-version tag (@v1 etc.) — a tag can be silently retargeted
# after the fact (e.g. the 2025 tj-actions/changed-files incident), and
# both jobs here carry contents: write. Each pin's trailing comment names
# the tagged release it was resolved from, for humans updating it later;
# re-resolve and re-audit rather than trusting the new tag's diff alone.

on:
  push:
    tags: ["v*"]

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # Both Darwin legs run on macos-latest (Apple Silicon): macOS's
          # native toolchain (Xcode/clang) can cross-link x86_64-apple-darwin
          # from an arm64 host. macos-13 (Intel) is deliberately not used
          # here — GitHub-hosted macos-13 runners queued 50+ min with zero
          # progress when tried on this repo in Epic 1's CI (see ci.yml).
          # codesign: "-" is ad-hoc signing (no certificate, no secret to
          # manage) — satisfies Apple Silicon's hard requirement that a
          # binary be signed to execute at all. It does NOT satisfy
          # Gatekeeper for a downloaded/quarantined file; that needs a
          # paid Apple Developer ID certificate + notarization, which
          # nobody has provisioned for this repo yet.
          - target: x86_64-apple-darwin
            os: macos-latest
            codesign: "-"
          - target: aarch64-apple-darwin
            os: macos-latest
            codesign: "-"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-26 -- rust-toolchain.toml's channel="stable" still controls the actual Rust version installed
        with:
          targets: ${{ matrix.target }}
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # aarch64-unknown-linux-musl needs a cross linker the ubuntu-latest
      # runner doesn't ship by default (unlike x86_64-unknown-linux-musl,
      # which only needs musl-tools) — this action wires up the right
      # cross toolchain for both musl targets uniformly.
      - if: contains(matrix.target, 'musl')
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          # tymux-cli is the package name; its actual [[bin]] target is
          # named tymux (crates/tymux-cli/Cargo.toml).
          bin: tymuxd,tymux
          # The default archive name ($bin-$target) only works for a
          # single binary — tymuxd and tymux ship together in one archive
          # per target, so this must be named explicitly.
          archive: tymux-$target
          target: ${{ matrix.target }}
          codesign: ${{ matrix.codesign }}
          token: ${{ secrets.GITHUB_TOKEN }}
