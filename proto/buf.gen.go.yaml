version: v2
# Rust codegen does NOT go through here — crates/tymux-proto/build.rs calls
# tonic-build directly against this proto tree, which is the idiomatic path
# for a Rust service. This file is the Go-scoped template; see buf.gen.ts.yaml
# for the TypeScript-scoped template.
#
# Split from a single combined buf.gen.yaml (see git history) because `buf
# generate` fails atomically if any plugin in the template is unresolvable —
# a bare `buf generate` against a template listing both TS and Go plugins
# fails in any CI job that only installs one client's toolchain.
#
# Go plugins are resolved from clients/go/bin (also local, not buf.build
# remote — same offline-generation goal), installed via:
#   GOBIN=$(pwd)/clients/go/bin go install \
#     google.golang.org/protobuf/cmd/protoc-gen-go@latest \
#     connectrpc.com/connect/cmd/protoc-gen-connect-go@latest
inputs:
  - directory: .
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/tstapler/tymux/clients/go/gen
plugins:
  - local: ../clients/go/bin/protoc-gen-go
    out: ../clients/go/gen
    opt: paths=source_relative
  - local: ../clients/go/bin/protoc-gen-connect-go
    out: ../clients/go/gen
    opt: paths=source_relative
