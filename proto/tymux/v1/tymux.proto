syntax = "proto3";

package tymux.v1;

// TymuxService is the daemon's public API. It's the thing tmux never had:
// a typed, cross-language RPC surface, so a web UI, an AI agent, or a CLI
// can all drive the same multiplexer without scraping terminal escape codes.
service TymuxService {
  // Reports the daemon's build version, wire-protocol revision, and optional
  // capabilities, so a client can decide whether it can talk to this daemon
  // (and which newer features it may use) before issuing anything else. See
  // docs/adr/0003-protocol-versioning.md for the compatibility policy. A
  // daemon older than this RPC (<= 1.3.0) answers UNIMPLEMENTED, which
  // clients should treat as "pre-versioning, protocol 0".
  rpc GetServerInfo(GetServerInfoRequest) returns (ServerInfo);
  rpc CreateSession(CreateSessionRequest) returns (Session);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc KillSession(KillSessionRequest) returns (KillSessionResponse);
  // Respawns fresh ptys for a dead-flagged (restored-but-not-yet-revived)
  // session, matching its persisted Layout shape — each pane's original
  // command re-run in its persisted cwd. Never triggered automatically on
  // daemon start (ADR-002); only an explicit call reaches this. A no-op
  // (ReviveSessionResponse.already_live=true) if the session is already
  // live — never a duplicate spawn.
  rpc ReviveSession(ReviveSessionRequest) returns (ReviveSessionResponse);

  // One-shot structured read of a pane's current screen — the AI-friendly
  // alternative to `tmux capture-pane` (which returns raw text you'd have
  // to re-parse). Cells carry attributes directly. scrollback_offset lets
  // a caller read a historical screen (copy-mode's navigation primitive)
  // instead of the live one.
  rpc CapturePane(CapturePaneRequest) returns (PaneSnapshot);
  // Forward-only substring search through a pane's scrollback — the
  // direct, non-interactive access path for programmatic/agent callers
  // (one shared history buffer, two access paths: this and CapturePane's
  // scrollback_offset).
  rpc SearchScrollback(SearchScrollbackRequest) returns (SearchScrollbackResponse);

  // Splits an existing pane into two, nesting a new Split node in its
  // window's Layout tree in the target pane's place. Rejected with
  // failed_precondition (naming the actual/minimum rows+cols) if the
  // resulting leaf would fall below the daemon's hard minimum pane size.
  rpc SplitPane(SplitPaneRequest) returns (Session);
  // Closes one pane. If it was the last pane in its window, the window
  // itself closes (cascading to KillSession if it was also the session's
  // last window) — see ClosePaneResponse.window_closed/session_closed.
  rpc ClosePane(ClosePaneRequest) returns (ClosePaneResponse);
  // Adds a new window (single pane) to an existing session.
  rpc CreateWindow(CreateWindowRequest) returns (Session);
  // Streams the subscribed window's Layout every time its structure or
  // geometry changes, so a client's local model stays in sync without
  // polling ListSessions.
  rpc WatchWindow(WatchWindowRequest) returns (stream WindowLayoutEvent);

  // Bidirectional stream: client sends input/resize events, server streams
  // output back. This is what an interactive attach (human or agent) uses.
  //
  // Contract:
  //  - The first AttachRequest on the stream MUST set the pane_id field of
  //    the oneof; any other first message is rejected with
  //    invalid_argument.
  //  - Detaching means fully cancelling this call (dropping/closing both
  //    directions). Half-closing only the send side does not stop the
  //    receive side or end the attach — the server keeps streaming output
  //    until the whole call is cancelled.
  //  - output_gap=true on an AttachEvent means the server's internal
  //    output broadcast channel dropped frames for this consumer (it fell
  //    behind); some output between the previous and next Output event was
  //    lost. This is not a fatal condition — normal streaming resumes
  //    immediately after.
  //  - Resize is now window-scoped, not pane-scoped (ADR-004): the
  //    daemon tracks every attached client's reported viewport per window
  //    and applies the dimension-wise minimum across all of them, rather
  //    than sizing this one pane to this one client's last report.
  //
  // Epic 1.1: shared reconnect-loop specification. This is the one
  // contract `tymux-cli`, `clients/ts`, and `clients/go` (Epics 5.1, 5.2,
  // 6.1) must all implement identically — do not reinvent per client.
  //  - resume_from_seq (AttachRequest, outside the oneof) is bound to the
  //    pane_id carried by that same first message on the stream; it has
  //    no meaning attached to any other message. Omitting it (None) is a
  //    full attach and behaves identically to a pre-feature client: the
  //    daemon responds with a PaneSnapshot priming event, as it always
  //    has. Setting it to Some(n) asks the daemon to replay OutputChunk
  //    events from its per-pane ReplayBuffer starting at seq n+1, skipping
  //    the PaneSnapshot, PROVIDED seq n+1 is still retained.
  //  - GapExceeded means the requested resume_from_seq is older than
  //    anything the ReplayBuffer still retains — the gap cannot be closed
  //    by replay. A GapExceeded event is always immediately followed by a
  //    PaneSnapshot event, which the client MUST treat as authoritative:
  //    discard any locally buffered partial/replayed state and redraw
  //    from the snapshot, exactly as a fresh (non-resuming) attach would.
  //  - Heartbeat is an empty keepalive sent on an application-level
  //    interval during an otherwise-idle stream, so a client can tell
  //    "connected but quiet" apart from a silently-dead transport without
  //    relying solely on TCP/HTTP2-level timeouts. It carries no data and
  //    requires no client response.
  //  - Reconnect backoff policy (ADR-004, revised): on stream failure, a
  //    conforming client retries with exponential backoff starting at
  //    200ms, doubling each attempt (x2 multiplier), capped at 8s per
  //    attempt, with +/-20% jitter, giving up after 14 attempts (nominal
  //    cumulative backoff ~68.6s). This ceiling is deliberately chosen to
  //    be >= the daemon's grace_period_duration (60s), so a client that
  //    keeps retrying on this schedule has a real chance of reconnecting
  //    before the daemon gives up on the pane's grace period.
  rpc Attach(stream AttachRequest) returns (stream AttachEvent);

  // Streams bytes into the stdin of a pane created with
  // CreateSessionRequest.stdin_stream (ADR-0006). First message names the
  // pane; later messages carry data or a close. Bytes are written in order and
  // the call returns once every message has been written (or the stream
  // closed); writes block while the process is not reading, so a slow reader
  // applies backpressure to the client. The pipe stays open after the stream
  // ends unless a `close` was sent, so one input can span several calls.
  // FAILED_PRECONDITION: the pane is dead, was not created with stdin_stream,
  // stdin is already closed, or the process closed its stdin / exited
  // (broken pipe). Advertised as capability "create_session.stdin_stream".
  rpc WriteStdin(stream WriteStdinRequest) returns (WriteStdinResponse);
}

// Whether a pane's/session's backing process is still running. proto3
// reserves 0 for UNSPECIFIED rather than overloading it as a real state, so
// an absent/default field is never silently misread as LIVE or DEAD.
enum Liveness {
  LIVENESS_UNSPECIFIED = 0;
  LIVENESS_LIVE = 1;
  LIVENESS_DEAD = 2;
}

message Session {
  string id = 1;
  string name = 2;
  repeated Window windows = 3;
  Liveness liveness = 4;
}

// Horizontal = side-by-side (tmux's -h); Vertical = stacked (tmux's
// default -v/no-flag). tymux names its own CLI verbs deliberately rather
// than reusing tmux's -h/-v flags, which are only mnemonic in retrospect.
enum Orientation {
  ORIENTATION_UNSPECIFIED = 0;
  ORIENTATION_HORIZONTAL = 1;
  ORIENTATION_VERTICAL = 2;
}

message Window {
  string id = 1;
  string name = 2;
  Layout layout = 3;
}

// Recursive tree describing one window's pane arrangement — either a
// single pane (leaf) or a Split of exactly two child Layouts. v1.0's
// client-facing rendering model is explicit focus-cycling (one pane's
// output on screen at a time), not composited multi-region rendering;
// this tree exists so a client's local model of pane shape/geometry
// stays correct even so (see WatchWindow).
message Layout {
  oneof node {
    Pane pane = 1;
    Split split = 2;
  }
}

message Split {
  Orientation orientation = 1;
  // Always exactly 2 entries — tymux's split model is strictly binary
  // (nested splits express any N-pane layout tmux itself supports).
  repeated LayoutChild children = 2;
}

message LayoutChild {
  Layout layout = 1;
  float ratio = 2;
}

message Pane {
  string id = 1;
  uint32 rows = 2;
  uint32 cols = 3;
  Liveness liveness = 4;
  // The pane's working directory at spawn time (Epic 1.5) — either the
  // daemon's own cwd, or whatever CreateSessionRequest.cwd requested.
  string cwd = 5;
}

message CreateSessionRequest {
  string name = 1;
  string command = 2; // defaults to $SHELL if empty
  // Working directory for the spawned pane. Empty means "the daemon's own
  // cwd" (matching `command`'s empty-means-default convention) — Epic 1.5.
  string cwd = 3;
  // Arguments for `command`. `command` is exec'd as a single program name, so
  // anything with arguments must come through here (e.g. command "/bin/sh",
  // args ["-c", "claude --resume x"]). Persisted and replayed on revive.
  repeated string args = 4;
  // Extra environment for the spawned pane, layered over the daemon's. Persisted
  // in plaintext with the session record and replayed on revive; do not put secrets here.
  map<string, string> env = 5;
  // Absolute path the pane process's stderr is appended to (opened
  // O_WRONLY|O_APPEND|O_CREAT, mode 0600, by the daemon — no shell involved).
  // stdin/stdout stay on the pty; stderr therefore no longer reaches the
  // pane's screen, scrollback or replay, and isatty(2) is false for the
  // process. Empty means "stderr stays on the pty" (the default). Persisted
  // and re-opened on revive. Advertised as capability
  // "create_session.stderr_redirect"; ADR-0004.
  string stderr_path = 6;
  // Further arguments, appended after `args` in order. Use this (alone) when a
  // value must come from a file: see ArgSpec. Resolved by the daemon at spawn
  // and again at every revive. Advertised as capability
  // "create_session.file_args"; ADR-0004.
  repeated ArgSpec arg_specs = 7;
  // Absolute path of a regular file that becomes the process's stdin, as
  // `< file` does in a shell. The daemon opens it read-only itself (no shell)
  // at every spawn and revive, so each run reads it from byte 0 and gets a
  // real EOF at its end; there is no size limit and the bytes are delivered
  // unmodified. stdout (and stderr, unless stderr_path is set) stay on the
  // pty, which remains the controlling terminal, but isatty(0) is false and
  // anything typed into the pane never reaches the process. A missing file
  // fails the call (CreateSession: NOT_FOUND, ReviveSession:
  // FAILED_PRECONDITION); an unreadable one is FAILED_PRECONDITION, and a
  // relative path or a non-regular file (directory, FIFO, device) is
  // INVALID_ARGUMENT. Empty means "stdin stays on the pty" (the default).
  // Persisted and re-opened on revive. Advertised as capability
  // "create_session.stdin_file"; ADR-0005.
  string stdin_path = 8;
  // Start the process with stdin on a pipe the daemon keeps open, to be fed
  // later through the WriteStdin RPC; the process sees EOF when a WriteStdin
  // `close` arrives (or the pane is discarded). stdout, stderr and the
  // controlling tty stay on the pty as with stdin_path, and isatty(0) is
  // false. Mutually exclusive with stdin_path (INVALID_ARGUMENT). Persisted;
  // on revive the pipe is recreated empty and open, and the client must
  // stream its input again (the bytes are never stored). Advertised as
  // capability "create_session.stdin_stream"; ADR-0006.
  bool stdin_stream = 9;
}

// One argv entry.
message ArgSpec {
  oneof source {
    // Used verbatim.
    string literal = 1;
    // Absolute path of a file whose entire contents (not trimmed) become this
    // argv entry. The daemon reads it at every spawn and revive; a missing or
    // unreadable file fails the call (CreateSession: NOT_FOUND /
    // FAILED_PRECONDITION, ReviveSession: FAILED_PRECONDITION, no pane is
    // respawned) rather than yielding an empty argument. The contents must be
    // valid UTF-8, contain no NUL byte and be under 128 KiB (Linux
    // MAX_ARG_STRLEN, including the terminating NUL): otherwise INVALID_ARGUMENT.
    string file_contents_path = 2;
  }
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message KillSessionRequest {
  string session_id = 1;
}

message KillSessionResponse {}

message ReviveSessionRequest {
  string session_id = 1;
}

message ReviveSessionResponse {
  bool already_live = 1;
  uint32 pane_count = 2; // number of panes respawned (0 if already_live)
  Session session = 3;
}

message SplitPaneRequest {
  string pane_id = 1; // target leaf to split
  Orientation orientation = 2;
  string command = 3; // defaults to $SHELL if empty
}

message ClosePaneRequest {
  string pane_id = 1;
}

message ClosePaneResponse {
  // Set (non-empty) if closing this pane emptied its window, which
  // therefore closed too. Absent/empty means the pane's sibling(s)
  // survived and the window is still open.
  string window_closed_id = 1;
  string window_closed_name = 2;
  // Set (non-empty) if the closed window was also the session's last
  // window — the whole session cascaded closed (a semantic KillSession).
  string session_closed_id = 3;
  string session_closed_name = 4;
  // The session as it stands after the close, if it still exists (absent
  // if session_closed_id is set).
  Session session = 5;
}

message CreateWindowRequest {
  string session_id = 1;
  string command = 2; // defaults to $SHELL if empty
}

message WatchWindowRequest {
  string window_id = 1;
}

// The status-bar-shaped read (Story 6.1) is folded into WatchWindow's
// existing stream rather than a new dedicated RPC (plan.md Unresolved
// Question #9, resolved at Epic 6 implementation time) — a client that
// wants status-bar data already needs WatchWindow for layout changes, so
// a second RPC would just be a redundant subscription to the same
// window's state.
message WindowLayoutEvent {
  Layout layout = 1;
  // How many clients are currently attached to a pane within this window
  // (ADR-004's viewport tracker, already counting this) — gRPC-
  // introspectable so a programmatic/agent client gets this without
  // ANSI-scraping the human-facing status bar.
  uint32 attached_client_count = 2;
}

message CapturePaneRequest {
  string pane_id = 1;
  // 0 (default) = the live screen. Increasing values scroll further back
  // into retained scrollback history.
  uint32 scrollback_offset = 2;
}

message SearchScrollbackRequest {
  string pane_id = 1;
  string pattern = 2; // plain substring, not regex
  uint32 start_offset = 3; // search starts here, scrolling further back
}

message SearchScrollbackResponse {
  bool found = 1;
  uint32 offset = 2; // the matching line's own scrollback offset
  string line = 3;
}

// CapturePane and SearchScrollback on a pane whose child has exited (but whose pane the daemon
// still holds) serve its last screen, with liveness = DEAD on the snapshot, rather than an error,
// so a client can still show the final output. Attach, input and resize still need a running
// pane. A pane the daemon holds no screen for (reloaded from disk after a restart) is
// FAILED_PRECONDITION for all of them.
message PaneSnapshot {
  string pane_id = 1;
  uint32 rows = 2;
  uint32 cols = 3;
  repeated Row grid = 4;
  uint32 cursor_row = 5;
  uint32 cursor_col = 6;
  Liveness liveness = 7;
  // OSC 8 hyperlink targets; Cell.hyperlink is a 1-based index into this table (0 = none).
  repeated Hyperlink hyperlinks = 8;
  // Terminal state a redraw must restore so input keeps working after a (re)attach.
  string title = 9;                // OSC 0/2 window title
  TerminalModes modes = 10;
  bool cursor_hidden = 11;         // DECTCEM (?25l)
  uint32 cursor_style = 12;        // DECSCUSR 0-6
  bool alt_screen = 13;            // grid is the alternate screen (?1049/?1047/?47)
  uint32 scroll_top = 14;          // DECSTBM, 1-based; 0 with scroll_bottom 0 = whole screen
  uint32 scroll_bottom = 15;
  repeated uint32 tab_stops = 16;  // 0-based columns with a tab stop (HTS/TBC)
  Charsets charsets = 17;
  // The cursor sits past the last column (cursor_col is clamped to cols-1); the next printed
  // character wraps to the next row, or overwrites the last column when DECAWM is off.
  bool cursor_pending_wrap = 18;
  // Set only when liveness is DEAD: the exited child's exit code, if it was captured. A child
  // killed by a signal reports 1, not 128+signal (portable-pty 0.8.1 collapses signal deaths).
  optional int32 exit_code = 19;
}

message TerminalModes {
  bool app_cursor_keys = 1;  // DECCKM ?1
  bool app_keypad = 2;       // DECKPAM / DECKPNM
  bool bracketed_paste = 3;  // ?2004
  bool focus_events = 4;     // ?1004
  uint32 mouse_mode = 5;     // 0 off, 1 X10 (?9), 2 normal (?1000), 3 button (?1002), 4 any (?1003)
  uint32 mouse_encoding = 6; // 0 default, 1 utf8 (?1005), 2 sgr (?1006), 3 urxvt (?1015)
  bool reverse_video = 7;    // DECSCNM ?5
  bool origin = 8;           // DECOM ?6
  bool no_autowrap = 9;      // DECAWM ?7 reset
  bool insert = 10;          // IRM 4
  bool newline = 11;         // LNM 20
}

// SCS designations: 0 = ASCII (B), 1 = DEC special graphics (0), 2 = UK (A).
message Charsets {
  uint32 g0 = 1;
  uint32 g1 = 2;
  uint32 g2 = 3;
  uint32 g3 = 4;
  uint32 gl = 5; // active GL set, 0-3 (SO/SI/LS2/LS3)
}

message Hyperlink {
  string uri = 1;
  string id = 2; // OSC 8 `id=` parameter; empty when the program gave none
}

message Row {
  repeated Cell cells = 1;
}

message Cell {
  string text = 1; // one grapheme cluster
  uint32 fg = 2;
  uint32 bg = 3;
  // bitflags: 1=bold, 2=underline, 4=reverse, 8=italic, 16=faint, 32=strikethrough,
  // 64=blink, 128=conceal, 256=overline. Bold and faint are independent (SGR 1/2, both cleared by 22).
  uint32 attrs = 4;
  // Meaningful only when the underline bit is set: 0=single, 1=double, 2=curly, 3=dotted, 4=dashed.
  uint32 underline_style = 5;
  // Underline color (SGR 58), packed like fg/bg; 0 = same as the text color.
  uint32 underline_color = 6;
  uint32 hyperlink = 7; // 1-based index into PaneSnapshot.hyperlinks; 0 = none
}

message AttachRequest {
  oneof payload {
    string pane_id = 1; // first message on the stream: which pane to attach to
    bytes input = 2;    // raw keystrokes to forward to the pty
    Resize resize = 3;
  }

  // Epic 1.1 / ADR-004 (revised): the highest OutputChunk.seq this client
  // already has for the pane named in this same first message. Absent
  // (None) means "no resume state, full attach" — behaves identically to
  // a pre-feature client, which never sends this field at all. Present
  // (Some(n), including Some(0)) asks the daemon to replay from its
  // ReplayBuffer starting at seq n+1 instead of sending a fresh
  // PaneSnapshot. See the Attach RPC's doc comment above for the full
  // reconnect contract.
  optional uint64 resume_from_seq = 4;
}

message WriteStdinRequest {
  oneof payload {
    string pane_id = 1; // first message only: which pane's stdin to write
    bytes data = 2;     // appended to the process's stdin, unmodified
    bool close = 3;     // send EOF: close the pipe's write end (must be true)
  }
}

message WriteStdinResponse {
  // Total bytes this call wrote to the pipe.
  uint64 bytes_written = 1;
}

message Resize {
  uint32 rows = 1;
  uint32 cols = 2;
}

// ADR-001: an absent `code` (proto3 field presence, not a separate
// `has_code` boolean) is a first-class "exited, but no code known" state —
// e.g. a process killed by a signal, or a `wait()` call that itself failed
// — never conflated with "exited with code 0".
message ExitStatus {
  optional int32 code = 1;
}

// Epic 1.1: a single sequenced output chunk. `seq` is the daemon's
// monotonically-increasing per-pane sequence number for this chunk (the
// same numbering space as PaneSnapshot's sequence and ReplayBuffer's
// retention window), letting a client build a `resume_from_seq` resume
// token from the highest `seq` it has durably received.
message OutputChunk {
  uint64 seq = 1;
  bytes data = 2;
}

// Epic 1.1: sent instead of a resumed OutputChunk stream when the
// client's requested `resume_from_seq` is older than anything the
// daemon's ReplayBuffer still retains. Per the Attach RPC's doc comment,
// the client MUST treat the PaneSnapshot event that immediately follows
// as authoritative and discard any locally buffered partial state — the
// gap cannot be closed by replay.
message GapExceeded {
  uint64 oldest_available_seq = 1;
}

// Epic 1.1: an empty keepalive event sent on an application-level
// interval during an otherwise-idle attach, so a client can distinguish
// "still connected, just quiet" from a silently-dead transport without
// waiting on TCP/HTTP2-level timeouts alone. Carries no data.
message Heartbeat {}

message AttachEvent {
  oneof payload {
    bytes output = 1; // raw pty output bytes, as they arrive
    PaneSnapshot snapshot = 2;
    // ADR-001: breaking change (bool -> message) on the same field number,
    // accepted deliberately — see the ADR for why. The pane's child
    // process has exited; no more output follows.
    ExitStatus exited = 3;
    // The server's output broadcast channel dropped frames for this
    // consumer (it fell behind a burst of pty output). Some output
    // between the previous and next Output event was lost; normal
    // streaming resumes immediately after this event.
    bool output_gap = 4;
    // Epic 1.1: replay-buffer-exceeded signal for a resume request whose
    // `resume_from_seq` is too old. See GapExceeded's own doc comment.
    GapExceeded gap_exceeded = 5;
    // Epic 1.1: application-level keepalive. See Heartbeat's own doc
    // comment.
    Heartbeat heartbeat = 6;
    // Epic 1.1 / ADR-001 (revised): a NEW, additive sibling to `output`
    // above — NOT a promotion/replacement of it. `output` (field 1) stays
    // byte-for-byte unchanged forever, so any pre-existing client that
    // only reads field 1 keeps working with zero code change and zero
    // wire-format difference. A client that wants resume support reads
    // this field instead: the same raw pty bytes, plus the `seq` needed
    // to build a `resume_from_seq` token. The daemon populates exactly
    // one of `output`/`output_chunk` per AttachEvent, not both.
    OutputChunk output_chunk = 7;
  }
}

message GetServerInfoRequest {
  // The caller's own protocol revision, for the daemon's logs; the daemon does
  // not reject on it (the client decides compatibility from ServerInfo).
  uint32 client_protocol_version = 1;
}

message ServerInfo {
  // The tymuxd build's semver, e.g. "1.4.0" (same value as `tymuxd --version`).
  string version = 1;
  // Wire-protocol revision: an integer bumped on any change a client may need
  // to branch on. Independent of `version`; additive changes that clients can
  // ignore do not bump it.
  uint32 protocol_version = 2;
  // Oldest client protocol revision this daemon still serves correctly.
  uint32 min_client_protocol_version = 3;
  // Feature names for optional behavior, e.g. "create_session.args_env". Check
  // for a capability rather than comparing versions when gating one feature.
  repeated string capabilities = 4;
  // The daemon process's id, so a supervisor can signal exactly this daemon.
  uint32 pid = 5;
  // Daemon start time, seconds since the Unix epoch.
  int64 started_at_unix = 6;
}
