[package]
name = "vt100"
version = "0.16.2"
edition = "2021"
rust-version = "1.70"
authors = ["Jesse Luehrs <doy@tozt.net>", "tymux contributors"]
description = "Fork of vt100 0.16.2 for tymux: adds SGR strikethrough/blink/conceal/overline/underline styles+color, independent bold/faint, colon-form colors, REP, DEC charsets, OSC 8 hyperlinks"
license = "MIT"
readme = "README.md"
publish = false

[lib]
name = "vt100"
path = "src/lib.rs"

[dependencies]
itoa = "1.0.15"
unicode-width = "0.2.1"
vte = "0.15.0"

[dev-dependencies]
serde_json = { workspace = true }
