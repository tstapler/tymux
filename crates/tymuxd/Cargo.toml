[package]
name = "tymuxd"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tymuxd"
path = "src/main.rs"

[dependencies]
tymux-core = { path = "../tymux-core" }
tymux-proto = { path = "../tymux-proto" }
tokio = { workspace = true }
tonic = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = { workspace = true }
constant_time_eq = "0.5"

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tracing-test = { workspace = true }
prost = { workspace = true }
# Epic 5.1: spawn_uds_test_server dials its harness the same way
# tymux-cli's dial_uds does (tower::service_fn + hyper_util::rt::TokioIo
# wrapping a real tokio::net::UnixStream) — test-only, not needed by the
# daemon binary itself.
tower = { workspace = true }
hyper-util = { workspace = true }
